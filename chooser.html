<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Graktor</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111318;
    color: #e6e8ec;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }
  .wrap { max-width: 560px; padding: 2rem; text-align: center; }
  h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.4rem; }
  p.sub { color: #9aa1ad; margin-bottom: 2rem; }
  .options { display: grid; gap: 1rem; text-align: left; }
  button.option {
    display: block;
    width: 100%;
    background: #1a1d24;
    border: 1px solid #2a2e38;
    border-radius: 10px;
    padding: 1.1rem 1.25rem;
    color: #e6e8ec;
    cursor: pointer;
    font-family: inherit;
  }
  button.option:hover { border-color: #4c6fff; background: #1d2130; }
  button.option strong { display: block; font-size: 1rem; margin-bottom: 0.3rem; }
  button.option span { color: #9aa1ad; font-size: 0.85rem; }
  .footnote { margin-top: 1.5rem; color: #5b6170; font-size: 0.78rem; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Welcome to Graktor</h1>
    <p class="sub">How would you like to run this install? You can switch later with Ctrl+Shift+M (Cmd+Shift+M on Mac).</p>
    <div class="options">
      <button class="option" id="cloud">
        <strong>Sign in with my Graktor account</strong>
        <span>Uses your existing paid Graktor subscription. Needs an internet connection to run.</span>
      </button>
      <button class="option" id="offline">
        <strong>Activate with a license key</strong>
        <span>Runs entirely on this computer, no ongoing internet needed. Activated once with a key.</span>
      </button>
    </div>
    <p class="footnote">Both modes are the same Graktor app underneath -- this just decides where your data lives.</p>
  </div>
  <script>
    document.getElementById("cloud").addEventListener("click", () => window.suiteApi.chooseMode("cloud"));
    document.getElementById("offline").addEventListener("click", () => window.suiteApi.chooseMode("offline"));
  </script>
</body>
</html>
